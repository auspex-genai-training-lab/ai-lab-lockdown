<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#02070d"><title>AI LAB : LOCKDOWN</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/effects.css"><link rel="stylesheet" href="css/opening.css"><link rel="stylesheet" href="css/story.css"><link rel="stylesheet" href="css/origin.css"><link rel="stylesheet" href="css/interactions.css"><link rel="stylesheet" href="css/ending.css"><link rel="stylesheet" href="css/responsive.css"></head><body class="auth-locked">
<section id="passwordGate" class="password-gate" aria-labelledby="gateTitle"><div class="gate-noise"></div><form id="passwordForm" class="gate-panel"><div class="gate-mark"><i></i><span>SECURE CLASS ACCESS</span></div><p class="gate-kicker">AI LAB / EDUCATION TERMINAL</p><h1 id="gateTitle">生成AI演習</h1><p class="gate-description">授業で案内されたパスワードを入力してください。</p><label for="gamePassword">パスワード</label><input id="gamePassword" name="password" type="password" autocomplete="current-password" enterkeyhint="go" required><button type="submit">ゲームを開始</button><p id="passwordError" class="gate-error" role="alert" aria-live="polite"></p><small>授業参加者向け簡易アクセス</small></form></section>
<section id="boot" class="screen active" aria-label="システム起動中"><pre id="bootText"></pre><button id="skipBoot">起動演出をスキップ</button></section>
<section id="title" class="screen"><div class="title-noise"></div><p>生成AI適性認証プログラム</p><h1 data-text="AI LAB">AI LAB</h1><h2>LOCKDOWN</h2><p class="title-copy">閉鎖された研究施設。出口を開く鍵は、あなたの判断。</p><div class="title-actions"><button id="newGame">はじめから</button><button id="continueGame">続きから</button></div><small>マウス・タッチだけで最後まで遊べます</small></section>
<main id="game" class="hidden"><div class="scanlines"></div><div id="alertWash"></div><header id="hud"><div class="brand"><b>AI LAB</b><span>LOCKDOWN</span></div><div id="stageInfo"><small id="stageCode">STAGE 1</small><strong id="stageName">起動</strong></div><div id="progress"><small>認証進行</small><div class="progress-track"><i id="progressBar"></i></div><b id="progressText">0 / 12</b></div></header><section id="scene" aria-label="研究施設"><div class="ambient-light"></div><div id="roomLabel"></div><div id="sceneObjects"></div><div id="door" class="door locked"><i></i><b>LOCKED</b></div><div id="statusStrip">非常電源で稼働中</div></section><aside id="mission"><small>現在の目的</small><p id="missionText"></p></aside><aside id="nova" aria-live="polite"><div class="nova-orb"><i></i></div><div><b>NOVA</b><p></p></div></aside><div id="toast" aria-live="assertive"></div></main>
<section id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-box"><div class="modal-kicker" id="modalKicker"></div><h2 id="modalTitle"></h2><div id="modalBody"></div></div></section>
<section id="ending" class="screen ending-screen"><div class="ending-grid"></div><div class="ending-door"></div><div id="endingNova" class="ending-nova"><div class="ending-rings"><i></i><i></i><i></i></div><div class="ending-eye"></div><span>NOVA CORE</span></div><div class="ending-dialogue"><b id="endingSpeaker">NOVA</b><p id="endingLine"></p></div><button id="returnTitle" class="hidden">タイトルへ戻る</button></section>
